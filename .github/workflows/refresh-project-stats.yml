name: Refresh project stats

# Two-step pipeline, no client-side JS shipped to visitors:
#   1. fetch-stats.py  — one data grab from the public repos / PyPI into
#      data/project-stats.json (the stored source of truth).
#   2. inject-stats.py — render that snapshot into every page at build time.
# The GitHub API and PyPI are only ever talked to from this workflow, never
# from the browser. New projects are added in fetch-stats.py's registry and
# inject-stats.py's page map, not here.

on:
  schedule:
    - cron: '17 6 * * *'          # daily at 06:17 UTC (off-peak minute)
  workflow_dispatch:              # manual "run now" button

concurrency:
  group: refresh-project-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write             # needed to commit refreshed data + pages

    steps:
      - uses: actions/checkout@v4

      # 1. One grab → store the snapshot.
      - name: Fetch stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch-stats.py

      # 2. Render the stored snapshot into every mapped page.
      - name: Render pages
        run: python3 scripts/inject-stats.py --data data/project-stats.json

      # Single commit covering whatever changed. If nothing changed
      # (no new releases, no new commits since last run), exit clean.
      - name: Commit and push if changed
        run: |
          PATHS="data/project-stats.json index.html gravel.html kindling.html wopr.html tyche.html embeddings.html morass/index.html"
          if git diff --quiet $PATHS; then
            echo "Nothing changed — skipping commit."
            exit 0
          fi
          git config user.name  "awrylabs-stats[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $PATHS
          git commit -m "stats: refresh project data and pages"
          git push
